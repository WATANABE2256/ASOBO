spring.application.name=asobo-web

# Railway assigns PORT dynamically (do NOT hardcode 8080)
server.port=${PORT:8080}
# Bind to all interfaces so Railway healthcheck can reach the app
server.address=0.0.0.0

# local = H2 (development), prod = PostgreSQL (Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf (enable cache in production)
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
