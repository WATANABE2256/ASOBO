<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ASOBO - 人気スポット</title>
    <link rel="stylesheet" th:href="@{/css/asobo.css}"/>
</head>
<body>
<div class="app">
    <header class="header">
        <span></span>
        <span class="header-title">人気スポット</span>
        <span></span>
    </header>

    <div class="content">
        <div class="filter-row">
            <a th:href="@{/spots}" class="chip" th:classappend="${selectedCategory == null} ? 'active'">すべて</a>
            <a th:each="cat : ${categories}" th:href="@{/spots(category=${cat})}" class="chip"
               th:classappend="${selectedCategory == cat} ? 'active'" th:text="${cat.label}">遊ぶ</a>
        </div>

        <a th:each="spot : ${spots}" th:href="@{/spots/{id}(id=${spot.id})}" class="list-card">
            <div class="list-thumb" th:classappend="${spot.gradient}" th:text="${spot.emoji}"></div>
            <div class="list-info">
                <p class="spot-name" th:text="${spot.name}"></p>
                <p class="meta">
                    <span th:text="'⭐ ' + ${spot.rating}"></span> ·
                    <span th:text="'徒歩' + ${spot.walkMinutes} + '分'"></span> ·
                    <span th:text="'〜' + ${#numbers.formatInteger(spot.priceMax, 1, 'COMMA')} + '円'"></span>
                </p>
            </div>
        </a>
    </div>

    <div th:replace="~{fragments/bottom-nav :: bottomNav(${activeTab})}"></div>
</div>
</body>
</html>
